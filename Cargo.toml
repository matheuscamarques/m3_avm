[package]
name = "m3_avm"
version = "0.1.0"
edition = "2021"
description = "M³-AVM (Multimodal Multi-Model Abstract Virtual Machine): tensor dataflow VM with time-addressed persistent memory"
authors = ["Matheus de Camargo Marques <matheuscamarques@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/matheuscamarques/m3_avm"
keywords = ["vm", "tensor", "ai", "avm", "interpreter"]
categories = ["emulators", "science"]

[lib]
name = "m3_avm"
path = "src/lib.rs"

[[bin]]
name = "m3_avm"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
libc = "0.2"
ndarray = { version = "0.16", features = ["rayon"] }
faer = "0.19"
nalgebra = "0.32"
nalgebra-sparse = "0.10"
sprs = "0.11"
rand = "0.8"
half = "2.2"
rayon = "1.8"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
hound = "3.5"
wgpu = { version = "0.19", optional = true }
pollster = { version = "0.3", optional = true }
fxhash = "0.2.1"

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "physics_bench"
harness = false

[[bench]]
name = "hybrid_ops_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
